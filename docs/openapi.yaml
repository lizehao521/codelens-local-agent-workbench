openapi: 3.0.3
info:
  title: CodeLens Programming Agent API
  version: 1.0.0
  description: |
    编程 Agent 后端 API——LLM 代理转发层。免登录、BYOK、服务端零留存。

    ⚠️ 已被取代（2026-10-24）：本文件描述的 v1.0 API（/api/v1/chat 系列）已退役，
    现行唯一依据是 docs/agent/openapi.yaml（v2.0）。本文仅作历史留存，不再维护。
servers:
  - url: /api/v1
  - url: /api
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  uptime: { type: number }
  /providers:
    get:
      summary: Provider 与模型列表（不含任何 Key）
      responses:
        '200':
          description: provider 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        baseUrl: { type: string }
                        models:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                        defaultModel: { type: string }
                        docsUrl: { type: string }
  /chat:
    post:
      summary: 非流式问答
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: 完整回答
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  finishReason: { type: string }
                  usage:
                    type: object
                    properties:
                      promptTokens: { type: integer }
                      completionTokens: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/RateLimited' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
  /chat/stream:
    post:
      summary: SSE 流式问答（主界面使用）
      description: |
        响应为 text/event-stream。事件名固定四种：
        - meta: {"provider","model"}
        - delta: {"text"}
        - done: {"finishReason","usage":{"promptTokens","completionTokens"}}
        - error: {"code","message"}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/RateLimited' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
components:
  schemas:
    ChatRequest:
      type: object
      required: [provider, model, task, messages]
      properties:
        provider:
          type: string
          enum: [deepseek, zhipu, moonshot, qwen, openai, custom]
        model: { type: string, minLength: 1, maxLength: 100 }
        apiKey:
          type: string
          description: BYOK 模式传入；不传则用服务端 env Key
        task:
          type: string
          enum: [analyze, explain, debug, optimize]
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 16384 }
        codeContext:
          type: object
          properties:
            language: { type: string, maxLength: 30 }
            filename: { type: string, maxLength: 200 }
            code: { type: string, maxLength: 32768 }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.3 }
        maxTokens: { type: integer, minimum: 256, maximum: 8192, default: 2048 }
        customBaseUrl:
          type: string
          description: 仅 provider=custom 时必填，https URL
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, MISSING_API_KEY, RATE_LIMITED, PAYLOAD_TOO_LARGE, UPSTREAM_ERROR, UPSTREAM_TIMEOUT]
            message: { type: string }
  responses:
    ValidationError:
      description: 400 校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MissingApiKey:
      description: 401 未提供 API Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 403 触发限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 413 请求体超限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: 502 上游 LLM 故障
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamTimeout:
      description: 504 上游超时（60s）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
