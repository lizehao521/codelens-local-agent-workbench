<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>CodeLens - 通用 Agent 工具调用平台</title>
    <!-- 内联 favicon：避免浏览器自动请求 /favicon.ico 产生 404（桌面端同理）。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f172a'/><circle cx='14' cy='14' r='7' fill='none' stroke='%2338bdf8' stroke-width='3'/><path d='M19 19l7 7' stroke='%2338bdf8' stroke-width='3'/></svg>"
    />
    <script>
      // 防主题闪烁：在 CSS 生效前读取 localStorage 设置并给 <html> 设 data-theme
      // 与 src/stores/settingsStore.ts 的 resolveTheme 逻辑保持一致，默认深色
      (function () {
        try {
          var raw = localStorage.getItem('codeagent.settings.v1');
          var theme = raw ? JSON.parse(raw).theme || 'system' : 'system';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
