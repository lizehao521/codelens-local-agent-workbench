server {
    listen 8788;
    server_name _;

    auth_basic           "CodeLens Demo";
    auth_basic_user_file /etc/nginx/.codelens.htpasswd;

    client_max_body_size 8m;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;
    proxy_buffering      off;
    proxy_cache          off;

    location / {
        proxy_hide_header  Content-Security-Policy;
        add_header         Content-Security-Policy "default-src 'self';base-uri 'self';font-src 'self' data:;form-action 'self';frame-ancestors 'self';img-src 'self' data:;object-src 'none';script-src 'self' 'unsafe-inline';script-src-attr 'none';style-src 'self' 'unsafe-inline';connect-src 'self'" always;

        proxy_pass         http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}